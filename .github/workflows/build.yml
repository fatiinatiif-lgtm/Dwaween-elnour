name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ترتيب الملفات
        run: |
          mkdir -p lib assets/images assets/icons
          mv -f *.dart lib/
          mv -f green_dome.jpg assets/images/
          mv -f app_icon.png assets/icons/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --project-name diwan_alnoor --org com.diwan.alnoor --platforms=android,ios .

      - name: اسم التطبيق على الهاتف
        run: sed -i 's/android:label="[^"]*"/android:label="دواوين النور"/' android/app/src/main/AndroidManifest.xml

      - name: رفع compileSdk لكل المكتبات
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdkVersion(36)
              }
            }
          }
          EOF

      - run: flutter pub add pdf file_picker:^8.3.7
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dawawin-alnoor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
