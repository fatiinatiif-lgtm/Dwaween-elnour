name: diwan_alnoor
description: تطبيق الدواوين الشعرية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.0.0
  pdf: ^3.10.8
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/green_dome.jpg
    - assets/salawat/
  fonts:
    - family: WinsoftThuluth
      fonts:
        - asset: assets/fonts/winsoft-thuluth-pro-bold.ttf
    - family: DecoThuluth
      fonts:
        - asset: assets/fonts/decotype-thuluth-ii.ttf
    - family: Amoshref
      fonts:
        - asset: assets/fonts/amoshref-thulth.ttf
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/aref-ruqaa-ink-bold.ttf
    - family: AAGalaxy
      fonts:
        - asset: assets/fonts/aa-galaxy-bold.ttf
    - family: Topaz3D
      fonts:
        - asset: assets/fonts/mcs-topaz-3d.ttf
    - family: Mothanna
      fonts:
        - asset: assets/fonts/Mothanna.ttf
    - family: ArefRuqaaBold
      fonts:
        - asset: assets/fonts/ArefRuqaa-Bold-1.ttf
    - family: Palestine
      fonts:
        - asset: assets/fonts/Palestine-Regular.ttf
    - family: DTThuluth
      fonts:
        - asset: assets/fonts/Dthuluth.ttf
    - family: UKIJSulus
      fonts:
        - asset: assets/fonts/ukij-sulus-tom.ttf
    - family: DimaThulth
      fonts:
        - asset: assets/fonts/DimaThulth2.ttf
    - family: Abuhmeda
      fonts:
        - asset: assets/fonts/abuhmeda-f2.ttf
    - family: KacstDecorative
      fonts:
        - asset: assets/fonts/KacstDecorative.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#293149'
  adaptive_icon_foreground: assets/icons/app_icon.png
