name: diwan_alnoor
description: تطبيق الدواوين الشعرية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/green_dome.jpg

  # لو عايزة خط عربي معيّن (مثلاً Amiri أو Noto Naskh Arabic):
  # حطي ملفات الخط في assets/fonts/ وفكّي التعليق، وأضيفي fontFamily في ThemeData
  # fonts:
  #   - family: Amiri
  #     fonts:
  #       - asset: assets/fonts/Amiri-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#293149'
  adaptive_icon_foreground: assets/icons/app_icon.png
